@if (loading$ | async) {
  <app-loading></app-loading>
}

<main class="page__container" role="main">
  @if (youtube != null) {
    <div class="video__container">
      @if (IsYoutubeVisible) {
        <!-- O YouTube exige o Referer para autorizar o player embutido (erro 153 sem ele).
             O Static Web Apps envia Referrer-Policy: same-origin, que suprime esse header. -->
        <iframe
          class="video"
          [src]="youtube"
          frameborder="0"
          allowfullscreen=""
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      }
    </div>
  }

  <article class="page__content">
    <h1 class="page__title">{{ pregacao?.title }}</h1>
    <p class="page__content__date">{{ pregacao?.date | date: "fullDate" }}</p>
    <p class="page__content__author">
      {{ pregacao?.preacher }}<br />
      {{ pregacao?.verse }}
    </p>

    @if (IsVisibleMP3) {
      <audio
        style="width: 100%"
        [src]="mp3"
        type="audio/mpeg"
        controls
        preload="metadata"
      ></audio>
    }

    <p>
      @if (IsVisibleMP3) {
        <a [href]="mp3">Baixar áudio</a>
      }
    </p>

    <!-- <app-share tipo="Pregacoes" id="{{ pregacao.cult_id }}"></app-share> -->
  </article>

  <nav class="pagination">
    <a class="btn pagination__prev" [routerLink]="['/pregacoes']">
      &lsaquo; Pregações
    </a>
  </nav>
</main>
